name: Générer et publier l'EPUB

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "**/*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/epub.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/epub.yml"
  workflow_dispatch:

concurrency:
  group: epub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Construire l'EPUB
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les liens Markdown
        run: npm run links:check:local

      - name: Générer l'EPUB
        run: npm run epub

      - name: Vérifier le fichier généré
        run: test -s livre-node-gtk-typescript.epub

      - name: Publier l'artefact du workflow
        uses: actions/upload-artifact@v7
        with:
          name: livre-node-gtk-typescript
          path: livre-node-gtk-typescript.epub
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publier la GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Télécharger l'EPUB
        uses: actions/download-artifact@v7
        with:
          name: livre-node-gtk-typescript

      - name: Créer ou actualiser la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" livre-node-gtk-typescript.epub --clobber
          else
            gh release create "$GITHUB_REF_NAME" livre-node-gtk-typescript.epub \
              --verify-tag \
              --generate-notes \
              --title "Documentation node-gtk $GITHUB_REF_NAME"
          fi
